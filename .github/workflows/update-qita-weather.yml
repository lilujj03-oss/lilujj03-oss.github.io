name: Update Qita Weather Data

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qita-weather-data
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      AUTO_UPDATE_MINUTES: "0"

    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qita-weather/source/requirements.txt

      - name: Verify CWA secret
        shell: bash
        run: |
          if [ -z "$CWA_API_KEY" ]; then
            echo "::error::Repository secret CWA_API_KEY is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r qita-weather/source/requirements.txt

      - name: Download and export current CWA data
        working-directory: qita-weather/source
        run: |
          python backend/download_weather.py
          python backend/parser.py
          python backend/rainfall.py
          python crawler.py
          python backend/export_snapshot.py ../assets/current-stations.json

      - name: Commit updated snapshot
        shell: bash
        run: |
          if git diff --quiet -- qita-weather/assets/current-stations.json; then
            echo "Weather snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qita-weather/assets/current-stations.json
          git commit -m "data: sync current CWA weather [skip ci]"
          git push
